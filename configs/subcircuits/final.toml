# The final subcircuit (Step 2.7, D36 + D37 + D43): the interim recipe plus every neuron active in
# the whole-brain, bot-driven recruitment runs of the real encoding (scripts/run_recruitment.py),
# before any stuck flag. Then every neuron with >= 30 synapses onto a recruited neuron, plus every
# pathway-test neuron. Probes (P1-P7) never build it; they validate it (D36).
#
# Recruitment: the 70 whole-brain runs of 2026-11-01 (configs/recruitment.toml), all 7 settings:
# theta_full 200 deg (R x f) and 1,082 deg (flat R, comparison 1). None entered the stuck state.
name = "final"
description = "D36 + D37 + D43: recruited by game inputs and the real encoding + their >= 30-synapse inputs"

[[include]]
pathway_tests = true

[[include]]
active = { experiments = ["E1", "E2", "E3", "E5b", "E5c", "S1", "S2", "S3"], signs = ["original", "corrected"], exclude_cascades = true, recruitment = "results/recruitment/whole_brain/theta200_flat1082" }

[[include]]
hops = { from_active = { experiments = ["E1", "E2", "E3", "E5b", "E5c", "S1", "S2", "S3"], signs = ["original", "corrected"], exclude_cascades = true, recruitment = "results/recruitment/whole_brain/theta200_flat1082" }, n = 1, direction = "in", min_synapses = 30 }
