# Step 0 pathway tests (J4), designed in docs/pathway_tests.md (S4).
# Run with scripts/run_pathway_tests.py. Results go to git-ignored results/pathway_tests/.
#
# Cell types are looked up by name in the flywire_annotations v3.1.0 table and checked against
# v783. Every rate is a model input rate (Poisson, D16), not a claimed biological firing rate.
# How results are judged, and how the round 2 rates below are picked: D28-D35 in docs/decisions.md.

frame_ms = 4.1667        # one 240 Hz physics tick (D23); the stepper rounds it to 4.2 ms (42 x 0.1 ms)
trials = 10              # per condition, each with its own seed
base_seed = 0            # seeds are derived from this plus each condition's name, so they never shift
rates_hz = [25, 50, 100, 150, 200]  # the sweep; 0 Hz is the shared baseline condition (E4 / S0)
stim_side = "right"      # stimulate one side, record both

[escape]
duration_ms = 1000
gf_partners = 20         # E6: top input partners per Giant Fiber, by synapse count (original signs)

[escape.e2]              # latency and offset: on/off cycles at each rate
on_ms = 300
off_ms = 300
cycles = 3
rates_hz = [150]         # round 2: add the lower rate picked from E1 by D32

[escape.e3]              # recruitment: random subsets of right LC4 at a fixed rate
fractions = [0.1, 0.25, 0.5, 1.0]
subsets = 5              # different random subsets per fraction (the 100% fraction has only one)
trials_per_subset = 2    # 5 subsets x 2 trials = 10 per fraction; 100% uses `trials`
rate_hz = 150
subset_seed = 0

[escape.e4]              # specificity controls
rate_hz = 150

[escape.e5]              # lesions; whole cell types are silenced, on both sides (E5a dropped, D35)
rate_hz = 150
inhibitory_partners = ["CB3707", "SAD014", "CL038", "PVLP010", "LHAD1g1", "CB0010", "CB0563"]
excitatory_partners = ["DNp70", "PVLP122b", "PVLP062", "PVLP151"]

[steering]
duration_ms = 1000
signs = ["original", "corrected"]   # D27: every steering test runs on both

[steering.s3]            # horizontal-motion control, at 150 Hz in round 1
rate_hz = 150

# Round 2: the half-of-maximum "down" rate per sign version, picked from S1 by D32. Setting it
# turns on S2 (fixed "down" drive at this rate plus an "up" sweep; 0 Hz = down only) and adds an
# S3 run at this rate, the one D31 judges. Until then both are skipped.
[steering.half_max_rate_hz]
# original = 50
# corrected = 50
