# Step 0 pathway tests (J4), designed in docs/pathway_tests.md (S4).
# Run with scripts/run_pathway_tests.py. Results go to git-ignored results/pathway_tests/.
#
# Cell types are looked up by name in the flywire_annotations v3.1.0 table and checked against
# v783. Every rate is a model input rate (Poisson, D16), not a claimed biological firing rate.
# How results are judged, and how the round 2 rates below are picked: D28-D35 in docs/decisions.md.

frame_ms = 4.1667        # one 240 Hz physics tick (D23); the stepper rounds it to 4.2 ms (42 x 0.1 ms)
trials = 10              # per condition, each with its own seed
base_seed = 0            # seeds are derived from this plus each condition's name, so they never shift
rates_hz = [25, 50, 100, 150, 200]  # the sweep; 0 Hz is the shared baseline condition (E4 / S0)
stim_side = "right"      # stimulate one side, record both

[escape]
duration_ms = 1000
gf_partners = 20         # E6: top input partners per Giant Fiber, by synapse count (original signs)

[escape.e2]              # latency and offset: on/off cycles at each rate
on_ms = 300
off_ms = 300
cycles = 3
rates_hz = [25, 150]     # 25 Hz: lowest rate firing within 100 ms in >= 9/10 E1 trials (D32, round 1)

[escape.e3]              # recruitment: random subsets of right LC4 at a fixed rate
fractions = [0.1, 0.25, 0.5, 1.0]
subsets = 5              # different random subsets per fraction (the 100% fraction has only one)
trials_per_subset = 2    # 5 subsets x 2 trials = 10 per fraction; 100% uses `trials`
rate_hz = 150
subset_seed = 0

[escape.e4]              # specificity controls
rate_hz = 150

[escape.e5]              # lesions; whole cell types are silenced, on both sides (E5a dropped, D35)
rate_hz = 150
inhibitory_partners = ["CB3707", "SAD014", "CL038", "PVLP010", "LHAD1g1", "CB0010", "CB0563"]
excitatory_partners = ["DNp70", "PVLP122b", "PVLP062", "PVLP151"]

[steering]
duration_ms = 1000
signs = ["original", "corrected"]   # D27: every steering test runs on both

[steering.s3]            # horizontal-motion control, at 150 Hz in round 1
rate_hz = 150

# Round 2: the half-of-maximum "down" rate per sign version, picked from S1 by D32. Setting it
# turns on S2 (fixed "down" drive at this rate plus an "up" sweep; 0 Hz = down only) and adds an
# S3 run at this rate, the one D31 judges. Until then both are skipped.
[steering.half_max_rate_hz]  # picked from round 1's S1 by D32
original = 50                 # right VS reaches 64% of its sweep maximum
corrected = 25                # right VS reaches 50.07% (25 Hz qualifies by D32's edge-case rule)

# --- Subcircuit building and validation (D36, J5 checkpoint 4) ---

# The game-input experiments repeated on the left side and on both sides at once, to find every
# neuron the game's inputs can recruit. Used to BUILD the subcircuit; not judged by D29-D31.
[recruitment]
sides = ["left", "both"]
trials = 5
experiments = ["E1", "E2", "E3", "E5b", "E5c", "S1", "S2", "S3"]

# Game-like probe tests, NEVER used to build a subcircuit: the held-out check of the D36 tolerance.
# Drafts for Shannyn's review before the whole-brain run.
[probes]
sides = ["right", "left", "both"]
trials = 5

[probes.p1]              # expanding looming: random chunks of a side's LC4 + LPLC2 switch on one by one
chunks = 4
step_ms = 75             # a new chunk every 75 ms (all four on after 300 ms)
rate_hz = 150
off_ms = 200
repeats = 2
seed = 1

[probes.p2]              # looming ramp: all of a side's LC4 + LPLC2, rate rising linearly, then off
ramp_ms = 300
top_hz = 200
off_ms = 200
repeats = 2

[probes.p3]              # up/down switching: downward and upward motion alternating
segment_ms = 150
rate_hz = 100
cycles = 3

[probes.p4]              # steering over scrolling: constant horizontal motion, downward motion on/off
horizontal_hz = 50
down_hz = 100
on_ms = 200
off_ms = 200
cycles = 3

[probes.p5]              # spatial looming: an LC4 + LPLC2 patch grown outward by shared input partners
first_neurons = 19       # per side at the first step, near E3's threshold; grows geometrically to all
steps = 8
step_ms = 40
rate_hz = 150
off_ms = 200
repeats = 2
seed = 1                 # picks the starting LC4 neuron on each side

[probes.p6]              # looming over scrolling: P1's looming plus constant front-to-back motion
types = ["T4a", "T5a"]
horizontal_hz = 50

[probes.p7]              # close obstacles: all of a side's LC4 + LPLC2 in short bursts
rate_hz = 150
on_ms = 100
off_ms = 50
cycles = 4
