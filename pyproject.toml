[project]
name = "stereo-flyness"
version = "0.1.0"
description = "A connectome-constrained fruit fly brain model (FlyWire) playing a minimal Geometry Dash-style game."
authors = [
    { name = "Jacob Banducci", email = "jbanducci321@gmail.com" }
]
# Pinned to 3.12 so both machines resolve the exact same lockfile.
requires-python = ">=3.12,<3.13"
dependencies = [
    "brian2>=2.10.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
